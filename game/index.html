<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gobble Run — the great Thanksgiving escape</title>
<meta name="description" content="Gobble Run: you are the turkey. Outrun the farmer, hurdle the oven and the carving knife, duck the banner, and reach the forest before Thanksgiving. A small canvas game that plays offline.">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f7c873; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Gobble Run: press Space or tap to jump the oven and the carving knife, Down to duck the banner, and outrun the farmer to the forest."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
